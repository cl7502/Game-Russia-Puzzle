<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Rainbow Block Puzzle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
      
      body {
        font-family: 'Inter', sans-serif;
        background-color: #0f172a; /* Slate 900 */
        touch-action: none; /* Prevent scrolling on mobile while playing */
        overflow: hidden;
      }

      /* Glossy effect for blocks */
      .block-gloss {
        background: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0.1) 50%, rgba(0,0,0,0.1) 51%, rgba(0,0,0,0.2) 100%);
        box-shadow: inset 1px 1px 2px rgba(255,255,255,0.5), inset -1px -1px 2px rgba(0,0,0,0.3);
      }

      /* Particle Explosion Animation */
      @keyframes explode {
        0% {
          transform: translate(0, 0) scale(1) rotate(0deg);
          opacity: 1;
        }
        100% {
          transform: translate(var(--tx), var(--ty)) scale(0) rotate(var(--r));
          opacity: 0;
        }
      }

      .animate-explode {
        animation: explode 0.5s ease-out forwards;
      }

      /* Flash Effect */
      @keyframes flash {
        0% { opacity: 0.8; transform: scale(1.1); }
        100% { opacity: 0; transform: scale(1.5); }
      }

      .animate-flash {
        animation: flash 0.3s ease-out forwards;
      }
    </style>

</head>

  </body>
</html>
